name: Build ZIP and publish release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (por exemplo, v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create ZIP and GitHub Release
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create project ZIP
        run: git archive --format=zip --output="musicclient-${TAG_NAME}.zip" "${GITHUB_SHA}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${TAG_NAME}" "musicclient-${TAG_NAME}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG_NAME}" \
            --generate-notes
